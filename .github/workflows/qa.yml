name: App QA

on:
  push:
    branches: [main, release/vocab-20261025]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0 jsdom@30.1.3
          npx playwright install --with-deps chromium
      - name: Run focused model checks
        run: |
          node qa/ranges-model.cjs
          node qa/placement-model.cjs
          node qa/speech.cjs index.html
          node qa/speech-dom.cjs .
          node qa/sw-model.cjs
      - name: Start app
        run: |
          python3 -m http.server 8000 > /tmp/vocab-http.log 2>&1 &
          sleep 2
      - name: Run end-to-end QA
        run: node qa/e2e.mjs
