name: App QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start app
        run: |
          python3 -m http.server 8000 > /tmp/vocab-http.log 2>&1 &
          sleep 2
      - name: Run end-to-end QA
        run: node qa/e2e.mjs
