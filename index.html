<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>升學英文智慧單字</title><style>
body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.app{max-width:900px;margin:auto;padding:18px 15px 40px}.card{background:#fff;border:1px solid #e3e8f0;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 8px 24px #0000000d}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{padding:20px;border:2px solid #e3e8f0;border-radius:16px;background:#fff;text-align:left}.choice b{font-size:21px;display:block;margin-bottom:6px}.sub{font-size:13px;color:#6b7280;line-height:1.5}button{border:0;border-radius:11px;padding:11px 14px;font-size:15px}.primary{background:#3157d5;color:white}.secondary{background:#edf0f5;color:#344054}.good{background:#e8f6ef;color:#16794f}.bad{background:#fdecec;color:#b74040}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#fff;border:1px solid #e3e8f0;border-radius:13px;padding:10px;text-align:center}.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:#6b7280}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tab{background:#e9edf5;color:#344054;white-space:nowrap}.tab.active{background:#172033;color:#fff}.word{font-size:40px;font-weight:800;text-align:center;margin:34px 0 6px}.meaning{text-align:center;font-size:24px;margin:22px 0 8px}.example{text-align:center;color:#4f5968;line-height:1.6;margin-bottom:24px}.pill{display:inline-block;font-size:12px;padding:5px 8px;border-radius:999px;background:#eef1f6;color:#596273}.task{display:flex;justify-content:space-between;align-items:center;border:1px solid #e3e8f0;border-radius:14px;padding:12px;margin:8px 0}.options{display:grid;gap:10px}.option{width:100%;text-align:left;background:#fff;border:1px solid #d9dee8;padding:14px}.option.correct{background:#eaf8f1;border-color:#2d9469}.option.wrong{background:#fdeeee;border-color:#c85858}.feedback{margin-top:14px;background:#f1f4f8;border-radius:12px;padding:13px;line-height:1.55}.progress{height:8px;background:#e6eaf0;border-radius:999px;overflow:hidden;margin:10px 0 16px}.progress>div{height:100%;background:#3157d5}.list{display:grid;gap:8px}.item{background:#fff;border:1px solid #e3e8f0;border-radius:13px;padding:12px;display:flex;justify-content:space-between;gap:12px}.bar{height:6px;background:#e8ebf1;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:#3157d5}input{width:100%;padding:13px;border:1px solid #d8dde6;border-radius:11px;font-size:17px}@media(max-width:650px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.word{font-size:34px}}
</style></head><body><div class="app">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px"><div><div style="font-size:24px;font-weight:800">📘 升學英文智慧單字</div><div class="sub">依台灣升學範圍分級，專攻真正不熟的字</div></div><button class="secondary" onclick="home()">首頁</button></div>

<section id="home"><div class="card"><h2>你要準備什麼？</h2><div class="grid">
<button class="choice" onclick="choose('j1200')"><b>國中 1,200 基礎</b><span class="sub">國中課綱基本字彙方向｜測試字庫</span></button>
<button class="choice" onclick="choose('j2000')"><b>國中 2,000 會考</b><span class="sub">常用參考字彙與會考閱讀方向｜測試字庫</span></button>
<button class="choice" onclick="choose('h4500')"><b>高中 4,500 學測核心</b><span class="sub">大考中心 Level 1–4｜測試字庫</span></button>
<button class="choice" onclick="choose('h7000')"><b>高中進階／挑戰</b><span class="sub">Level 5–6 與進階閱讀｜測試字庫</span></button>
</div></div><div class="card"><h3>先測程度</h3><p class="sub">先用 12 題自適應小測驗估計較適合的範圍。</p><button class="primary" onclick="startPlacement()">開始程度測驗</button></div><div class="sub">目前是流程驗證版：先把分級、複習、題型與弱點分析做對，再擴成完整官方字庫。</div></section>

<section id="placement" class="hidden"><div class="card"><div class="progress"><div id="placeBar"></div></div><div id="placeBox"></div></div></section>

<section id="dash" class="hidden"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2 id="trackTitle" style="margin-bottom:4px"></h2><div id="trackDesc" class="sub"></div></div><button class="secondary" onclick="home()">切換範圍</button></div><div class="stats"><div class="stat"><b id="knownN">0</b><span>已熟練</span></div><div class="stat"><b id="dueN">0</b><span>今日到期</span></div><div class="stat"><b id="weakN">0</b><span>弱項單字</span></div><div class="stat"><b id="rateN">0%</b><span>正確率</span></div></div></div>
<div class="tabs"><button class="tab active" data-tab="today">今日任務</button><button class="tab" data-tab="learn">單字學習</button><button class="tab" data-tab="quiz">智慧測驗</button><button class="tab" data-tab="wrong">錯題複習</button><button class="tab" data-tab="analysis">學習分析</button></div>
<div id="today" class="pane"></div><div id="learn" class="pane hidden"></div><div id="quiz" class="pane hidden"></div><div id="wrong" class="pane hidden"></div><div id="analysis" class="pane hidden"></div></section>
</div><script>
const W=[
['answer','回答；答案','n./v.','Please answer the question.',1,1],['because','因為','conj.','I stayed home because I was sick.',1,1],['borrow','借入','v.','May I borrow your pen?',1,1],['careful','小心的','adj.','Be careful when crossing the street.',1,1],['different','不同的','adj.','The two ideas are different.',1,1],['important','重要的','adj.','Sleep is important for health.',1,1],['language','語言','n.','English is an international language.',1,1],['practice','練習','n./v.','Daily practice improves your English.',1,1],['weather','天氣','n.','The weather is nice today.',1,1],['advice','建議','n.','My teacher gave me useful advice.',2,2],['although','雖然','conj.','Although it was raining, we went out.',2,2],['environment','環境','n.','We should protect the environment.',2,2],['experience','經驗；經歷','n./v.','It was a valuable experience.',2,2],['improve','改善；進步','v.','Reading can improve your vocabulary.',2,2],['prepare','準備','v.','She prepared carefully for the exam.',2,2],['receive','收到；接收','v.','I received a message this morning.',2,2],['successful','成功的','adj.','The event was very successful.',2,2],['through','穿過；透過','prep./adv.','We walked through the park.',2,2],['without','沒有；不帶','prep.','He left without saying goodbye.',2,2],
['grade','年級；成績；評分','n./v.','She received a good grade.',1,0],['ground','地面；土地','n./v.','The ball fell to the ground.',1,0],['grow','成長；種植','v.','Children grow quickly.',1,0],['guess','猜測','v./n.','Can you guess the answer?',1,0],['habit','習慣','n.','Reading is a useful habit.',1,0],['gradual','逐漸的','adj.','There was a gradual improvement.',2,0],['grain','穀物；顆粒','n.','Rice is an important grain.',2,0],['guard','守衛；保護','n./v.','The guard checked the entrance.',2,0],['handle','處理；把手','v./n.','She handled the problem calmly.',2,0],['grasp','理解；抓住','v./n.','He quickly grasped the main idea.',3,0],['grocery','食品雜貨','n.','We bought groceries after work.',3,0],['guardian','監護人；守護者','n.','A guardian signed the form.',4,0],['guarantee','保證','v./n.','The company guarantees the product.',4,0],['distinguish','區分；辨別','v.','We must distinguish fact from opinion.',4,0],['consequence','結果；後果','n.','Every decision has consequences.',4,0],['significant','重要的；顯著的','adj.','There was a significant increase in sales.',4,0],['gravity','重力；嚴重性','n.','Gravity pulls objects toward Earth.',5,0],['habitat','棲息地','n.','The forest is home to many habitats.',5,0],['guideline','指導原則','n.','Please follow the safety guidelines.',5,0],['grieve','悲傷；哀悼','v.','The family grieved after the loss.',5,0],['grim','嚴峻的；令人沮喪的','adj.','The report painted a grim picture.',5,0],['substantial','大量的；重大的','adj.','The project requires substantial investment.',5,0],['preliminary','初步的','adj.','These are preliminary findings.',5,0],['coherent','連貫的；一致的','adj.','She gave a coherent explanation.',5,0],['inevitable','不可避免的','adj.','Some change is inevitable.',5,0],['hamper','妨礙；阻礙','v.','Heavy rain hampered rescue efforts.',6,0],['harness','利用；控制','v./n.','Scientists hope to harness solar energy.',6,0],['harass','騷擾','v.','Workers should not be harassed at work.',6,0],['deteriorate','惡化','v.','Conditions may deteriorate rapidly.',6,0]
].map(a=>({w:a[0],m:a[1],p:a[2],e:a[3],lv:a[4],j:a[5]}));
const T={j1200:{t:'國中 1,200 基礎',d:'國中基本字彙方向（測試字庫）',f:x=>x.j===1},j2000:{t:'國中 2,000 會考',d:'國中常用參考字彙方向（測試字庫）',f:x=>x.j>0},h4500:{t:'高中 4,500 學測核心',d:'大考中心 Level 1–4（測試字庫）',f:x=>x.lv<=4},h7000:{t:'高中進階／挑戰',d:'大考中心 Level 1–6（測試字庫）',f:x=>x.lv<=6}};
let tr='',idx=0,Q=null,db=JSON.parse(localStorage.getItem('sv3')||'{}');
const st=w=>db[w]||(db[w]={m:0,ok:0,bad:0,due:0,types:{en:0,zh:0,cloze:0,spell:0}}),save=()=>localStorage.setItem('sv3',JSON.stringify(db)),pool=()=>W.filter(T[tr].f);
function screen(id){['home','placement','dash'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}function home(){screen('home')}
function choose(t){tr=t;trackTitle.textContent=T[t].t;trackDesc.textContent=T[t].d;renderAll();screen('dash')}
function renderAll(){stats();today.innerHTML='<div class="card"><h3>今天要做的事</h3>'+task('新單字',pool().filter(x=>st(x.w).ok+st(x.w).bad===0).length,'先建立辨識')+task('到期複習',pool().filter(x=>!st(x.w).due||st(x.w).due<=Date.now()).length,'依熟練度安排')+task('錯題重測',pool().filter(x=>st(x.w).bad>0).length,'優先補弱點')+'<button class="primary" onclick="startSmart()">開始今日學習</button></div>';renderLearn();quiz.innerHTML='<div class="card"><h3>智慧測驗</h3><p class="sub">優先挑熟練度低、近期答錯、或已到期單字，混合英→中、中→英、克漏、拼字。</p><button class="primary" onclick="startSmart()">開始 10 題</button></div>';wrong.innerHTML='<div class="card"><h3>錯題複習</h3><button class="primary" onclick="startWrong()">只測錯題</button></div>';analysis.innerHTML='<div class="card"><h3>學習分析</h3><div class="list">'+pool().sort((a,b)=>st(a.w).m-st(b.w).m).map(x=>'<div class="item"><div><b>'+x.w+'</b><div class="sub">'+x.m+'</div></div><div style="min-width:90px"><div class="sub">熟練 '+st(x.w).m+'/5</div><div class="bar"><i style="width:'+st(x.w).m*20+'%"></i></div></div></div>').join('')+'</div></div>'}
function task(n,c,d){return '<div class="task"><div><b>'+n+'</b><div class="sub">'+d+'</div></div><span class="pill">'+Math.min(c,20)+' 題</span></div>'}
function stats(){let a=pool(),ok=a.reduce((s,x)=>s+st(x.w).ok,0),tot=a.reduce((s,x)=>s+st(x.w).ok+st(x.w).bad,0);knownN.textContent=a.filter(x=>st(x.w).m>=4).length;dueN.textContent=a.filter(x=>!st(x.w).due||st(x.w).due<=Date.now()).length;weakN.textContent=a.filter(x=>st(x.w).bad>st(x.w).ok||st(x.w).m<2).length;rateN.textContent=tot?Math.round(ok/tot*100)+'%':'0%'}
function renderLearn(){let x=pool()[idx%pool().length],s=st(x.w);learn.innerHTML='<div class="card"><span class="pill">Level '+x.lv+'</span><div class="word">'+x.w+'</div><div class="sub" style="text-align:center">'+x.p+'</div><div id="a" class="hidden"><div class="meaning">'+x.m+'</div><div class="example">'+x.e+'</div></div><div style="text-align:center"><button id="r" class="primary" onclick="a.classList.remove(\'hidden\');r.classList.add(\'hidden\')">顯示答案</button></div><div class="grid" style="margin-top:12px"><button class="bad" onclick="mark(false)">還不熟</button><button class="good" onclick="mark(true)">我會了</button></div><div class="sub" style="margin-top:10px">熟練度 '+s.m+'/5</div><div class="bar"><i style="width:'+s.m*20+'%"></i></div></div>'}
function mark(ok){update(pool()[idx%pool().length],ok,'en');idx++;save();renderAll()}
function ranked(a){return [...a].sort((A,B)=>{let a=st(A.w),b=st(B.w),now=Date.now();return ((b.bad*3)+(5-b.m)*2+(!b.due||b.due<=now?3:0))-((a.bad*3)+(5-a.m)*2+(!a.due||a.due<=now?3:0))})}
function startSmart(){Q={items:ranked(pool()).slice(0,10),i:0,score:0,target:'quiz'};switchPane('quiz');rq()}function startWrong(){let a=pool().filter(x=>st(x.w).bad>0);if(!a.length){wrong.innerHTML='<div class="card">目前沒有錯題。</div>';return}Q={items:ranked(a).slice(0,10),i:0,score:0,target:'wrong'};switchPane('wrong');rq()}
function qt(x){let a=['en','zh','cloze','spell'];return a.sort((u,v)=>st(x.w).types[u]-st(x.w).types[v])[0]}function sh(a){return [...a].sort(()=>Math.random()-.5)}
function rq(){let x=Q.items[Q.i],t=qt(x),body='';if(t==='spell')body='<h2>'+x.m+'</h2><input id="sp" placeholder="請拼出英文單字"><button class="primary" style="margin-top:10px" onclick="spell()">送出</button>';else{let q=t==='en'?'「'+x.w+'」最適合的中文意思是？':t==='zh'?'「'+x.m+'」最適合的英文是？':x.e.replace(new RegExp('\\b'+x.w+'\\b','i'),'_____');let c=t==='en'?x.m:x.w,others=pool().filter(y=>y.w!==x.w).map(y=>t==='en'?y.m:y.w),opts=sh([c,...sh([...new Set(others)]).slice(0,3)]);body='<h2>'+q+'</h2><div class="options">'+opts.map(o=>'<button class="option" onclick="ans(this,'+JSON.stringify(o)+','+JSON.stringify(c)+','+JSON.stringify(t)+')">'+o+'</button>').join('')+'</div>'}document.getElementById(Q.target).innerHTML='<div class="card"><div class="sub">第 '+(Q.i+1)+' / '+Q.items.length+' 題 · '+({en:'英→中',zh:'中→英',cloze:'例句克漏',spell:'拼字'}[t])+'</div><div class="progress"><div style="width:'+Math.round(Q.i/Q.items.length*100)+'%"></div></div>'+body+'<div id="fb"></div></div>'}
function ans(btn,v,c,t){if(Q.lock)return;Q.lock=true;document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b.textContent===c)b.classList.add('correct');else if(b===btn)b.classList.add('wrong')});done(v===c,t,c)}function spell(){if(Q.lock)return;Q.lock=true;let x=Q.items[Q.i];done((sp.value||'').trim().toLowerCase()===x.w.toLowerCase(),'spell',x.w)}
function done(ok,t,c){let x=Q.items[Q.i];update(x,ok,t);if(ok)Q.score++;save();stats();fb.innerHTML='<div class="feedback">'+(ok?'答對了。':'答錯了。')+' <b>'+x.w+'</b> = '+x.m+(ok?'':'<br>正確答案：<b>'+c+'</b>')+'<br><button class="primary" style="margin-top:10px" onclick="nextQ()">下一題</button></div>'}
function update(x,ok,t){let s=st(x.w),now=Date.now();if(ok){s.ok++;s.types[t]++;s.m=Math.min(5,s.m+1);s.due=now+[0,1,3,7,14,30][s.m]*86400000}else{s.bad++;s.types[t]=Math.max(-3,s.types[t]-1);s.m=Math.max(0,s.m-1);s.due=now+86400000}}
function nextQ(){Q.i++;Q.lock=false;if(Q.i>=Q.items.length){document.getElementById(Q.target).innerHTML='<div class="card" style="text-align:center"><h2>'+Q.score+' / '+Q.items.length+'</h2><p>本次測驗完成</p></div>';stats()}else rq()}
function switchPane(id){document.querySelectorAll('.pane').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id))}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchPane(b.dataset.tab));
function startPlacement(){screen('placement');let lo=1,hi=6,i=0,h=[];function ask(){if(i>=12){let avg=h.reduce((s,x)=>s+x,0)/Math.max(1,h.length),rec=avg<2?'j2000':avg<4.5?'h4500':'h7000';placeBar.style.width='100%';placeBox.innerHTML='<div style="text-align:center"><h2>建議：'+T[rec].t+'</h2><p class="sub">這是測試版粗略估計，正式版會用更大的校準題庫。</p><button class="primary" onclick="choose(\''+rec+'\')">使用這個範圍</button></div>';return}let lv=Math.round((lo+hi)/2),cand=W.filter(x=>x.lv===lv),x=cand[Math.floor(Math.random()*cand.length)]||W[0],opts=sh([x.m,...sh(W.filter(y=>y.w!==x.w).map(y=>y.m)).slice(0,3)]);placeBar.style.width=Math.round(i/12*100)+'%';placeBox.innerHTML='<div class="sub">第 '+(i+1)+' / 12 題 · Level '+lv+'</div><h2>「'+x.w+'」的意思是？</h2><div class="options">'+opts.map(o=>'<button class="option">'+o+'</button>').join('')+'</div>';placeBox.querySelectorAll('.option').forEach(b=>b.onclick=()=>{let ok=b.textContent===x.m;h.push(ok?lv:Math.max(1,lv-1));if(ok)lo=Math.min(6,lv+1);else hi=Math.max(1,lv-1);if(lo>hi){lo=Math.max(1,lv-1);hi=Math.min(6,lv+1)}i++;ask()})}ask()}
</script></body></html>
